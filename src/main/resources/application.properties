spring.application.name=cafe
spring.jpa.hibernate.ddl-auto=validate
spring.sql.init.mode=embedded
app.jwt.secret=${JWT_SECRET:}
app.jwt.access-token-validity-seconds=3600
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
cafe.order.kafka.topic.order-paid=${ORDER_PAID_TOPIC:cafe.order-paid}
cafe.order.kafka.send-timeout-seconds=${ORDER_PAID_SEND_TIMEOUT_SECONDS:3}
app.portone.store-id=${PORTONE_STORE_ID:}
app.portone.channel-key=${PORTONE_CHANNEL_KEY:}
app.portone.api-secret=${PORTONE_API_SECRET:}
