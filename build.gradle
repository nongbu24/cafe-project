plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.0'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'
description = 'cafe'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.springframework.boot:spring-boot-flyway'
    implementation 'org.springframework.boot:spring-boot-h2console'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-websocket'
    implementation 'org.springframework.security:spring-security-crypto'
    implementation 'com.querydsl:querydsl-jpa:5.1.0:jakarta'
    annotationProcessor 'com.querydsl:querydsl-apt:5.1.0:jakarta'
    annotationProcessor 'jakarta.annotation:jakarta.annotation-api'
    annotationProcessor 'jakarta.persistence:jakarta.persistence-api'
    runtimeOnly 'com.h2database:h2'
    runtimeOnly 'org.flywaydb:flyway-database-postgresql'
    runtimeOnly 'org.postgresql:postgresql'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-websocket-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}

def readDotenv(File dotenvFile) {
    if (!dotenvFile.exists()) {
        return [:]
    }

    def values = [:]
    dotenvFile.eachLine('UTF-8') { line ->
        def trimmed = line.trim()
        if (!trimmed || trimmed.startsWith('#') || !trimmed.contains('=')) {
            return
        }

        def normalized = trimmed.startsWith('export ') ? trimmed.substring('export '.length()).trim() : trimmed
        def separatorIndex = normalized.indexOf('=')
        def key = normalized.substring(0, separatorIndex).trim()
        def value = normalized.substring(separatorIndex + 1).trim()

        if (!key) {
            return
        }

        if ((value.startsWith('"') && value.endsWith('"')) || (value.startsWith("'") && value.endsWith("'"))) {
            value = value.substring(1, value.length() - 1)
        }

        values[key] = value
    }

    values
}

tasks.named('bootRun') {
    doFirst {
        readDotenv(rootProject.file('.env')).each { key, value ->
            if (System.getenv(key) == null) {
                environment key, value
            }
        }
    }
}
